# Render.com Deploy Config — Hôm nay ăn gì · Taste of Vietnam v0.1
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API + UI Studio ───────────────────────────────────────────────
  - type: web
    name: taste-of-vietnam-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        # Render injects PORT automatically — do not set here
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      # Măm AI chat (docs/MAM_AI.md): CometAPI, OpenAI-compatible. Without LLM_API_KEY the chat
      # runs on the local parser ("chế độ offline").
      - key: LLM_API_KEY
        sync: false   # CometAPI key — set manually in the dashboard
      - key: LLM_BASE_URL
        value: https://api.cometapi.com/v1
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: LLM_TIMEOUT_MS
        value: "8000"
      - key: LLM_RATE_PER_HOUR
        value: "20"
      - key: JWT_SECRET
        generateValue: true   # Render generates a random secret once
      - key: PAYOS_CHECKSUM_KEY
        sync: false   # From the PayOS dashboard; without it the payment webhook rejects everything
      - key: ADMIN_PHONES
        sync: false   # Comma-separated phones that log in as admin
      - key: MERCHANT_PHONES
        sync: false
      - key: SMS_API_KEY
        sync: false   # eSMS.vn; without SMS keys phone login is off in production (guest works)
      - key: SMS_SECRET_KEY
        sync: false
      - key: SMS_BRANDNAME
        sync: false
      # DATABASE_URL (Render Postgres with PostGIS) is set in the dashboard, not here.
      # With it set the server refuses to start while migrations are pending (Render then keeps
      # the previous deploy running). Either run `npm run db:migrate && npm run db:seed` against
      # that database from a machine with its external URL, or set DB_AUTO_MIGRATE=true (the free
      # plan has no shell): migrations then run at boot and an empty catalogue gets the demo seed.
      # Without DATABASE_URL the app runs in memory and loses data on restart.

    healthCheckPath: /api/v1/suggestions/today

    # Auto-deploy when main branch changes
    autoDeploy: true
