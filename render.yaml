# Render.com Deploy Config — Hôm nay ăn gì · Taste of Vietnam v0.1
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API + UI Studio ───────────────────────────────────────────────
  - type: web
    name: taste-of-vietnam-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        # Render injects PORT automatically — do not set here
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Render generates a random secret once
      - key: PAYOS_CHECKSUM_KEY
        sync: false   # From the PayOS dashboard; without it the payment webhook rejects everything
      - key: ADMIN_PHONES
        sync: false   # Comma-separated phones that log in as admin
      - key: MERCHANT_PHONES
        sync: false
      - key: SMS_API_KEY
        sync: false   # eSMS.vn; without SMS keys phone login is off in production (guest works)
      - key: SMS_SECRET_KEY
        sync: false
      - key: SMS_BRANDNAME
        sync: false

    healthCheckPath: /api/v1/suggestions/today

    # Auto-deploy when main branch changes
    autoDeploy: true
