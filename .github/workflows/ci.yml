name: Hôm Nay Ăn Gì · Taste of Vietnam v0.2 — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── JOB 1: BACKEND QA & END-TO-END TESTS (NODE 20) ─────────────────────────
  backend-qa:
    name: Backend QA, E2E & DB Fallback Suite (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Full QA & E2E Acceptance Suite (in-memory mode)
        run: npm test

      - name: Verify Cloud Health Check Endpoint (/health)
        run: |
          node -e "
          import('./server.js').then(({ createAppServer }) => {
            const server = createAppServer();
            server.listen(3001, () => {
              fetch('http://127.0.0.1:3001/health').then(r => r.json()).then(h => {
                console.log('✅ Health check response:', h);
                server.close();
                if (h.status !== 'healthy' || h.modules_loaded !== 20) {
                  console.error('❌ Health check validation failed!');
                  process.exit(1);
                }
              }).catch(err => {
                console.error('❌ Failed to fetch /health:', err);
                process.exit(1);
              });
            });
          });"

      - name: Build UI bundle and check it is committed in sync
        run: |
          npm run build:ui
          git diff --exit-code --stat ui-design/index.html || (echo "❌ ui-design/index.html is out of date: run 'npm run build:ui' and commit it" && exit 1)

      - name: Check Web UI Studio 99-Screen Bundle Size
        run: |
          BUNDLE_SIZE=$(du -sk ui-design/index.html | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE}KB"
          if [ "$BUNDLE_SIZE" -gt 5120 ]; then
            echo "⚠️ Warning: Bundle exceeds 5MB"
          else
            echo "✅ Bundle size OK: ${BUNDLE_SIZE}KB"
          fi

      - name: Verify Docker Compose Architecture
        run: docker compose config -q

  # ─── JOB 2: POSTGRESQL + POSTGIS: MIGRATIONS, REPOSITORY & RESTART SURVIVAL ─
  postgres-db:
    name: PostgreSQL + PostGIS Suite (migrations, repository, restart survival)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tov
          POSTGRES_PASSWORD: tov
          POSTGRES_DB: tov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tov -d tov_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tov:tov@localhost:5432/tov_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run the PostgreSQL suite (fails if any test is skipped)
        run: |
          npm run test:db 2>&1 | tee db-test.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q '^# skipped 0' db-test.log || (echo "❌ PostgreSQL tests were skipped" && exit 1)

      - name: Migrations apply cleanly on an empty database and are then up to date
        env:
          DATABASE_URL: postgres://tov:tov@localhost:5432/tov_test
        run: |
          psql "$DATABASE_URL" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npm run db:setup
          npm run db:migrate:status | tee status.json
          node -e "const s=JSON.parse(require('fs').readFileSync('status.json','utf8').slice(require('fs').readFileSync('status.json','utf8').indexOf('{')));if(s.pending.length||s.changed.length){console.error('pending/changed migrations',s);process.exit(1)}"

  # ─── JOB 3: FLUTTER MOBILE CODE QUALITY & DEPENDENCIES CHECK ────────────────
  flutter-mobile:
    name: Flutter Mobile Syntax & Lint Validation (20 Screens)
    runs-on: ubuntu-latest
    # Flutter is not the launch platform yet (web/PWA first) and the project still
    # misses android/app/src/main/res and pubspec.lock. Analyze errors now FAIL this
    # job (red ✗, visible on every PR) without blocking the Node backend checks.
    # Remove continue-on-error once `flutter analyze` is clean.
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile-flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Packages
        run: |
          cd mobile-flutter
          flutter pub get

      - name: Analyze Flutter Source (20 Screens & Theme)
        run: |
          cd mobile-flutter
          set +e
          flutter analyze --no-fatal-infos
          status=$?
          echo "### 📱 Flutter Mobile Analysis Summary" >> $GITHUB_STEP_SUMMARY
          if [ $status -eq 0 ]; then
            echo "✅ flutter analyze passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ flutter analyze found errors (exit $status). See the log above." >> $GITHUB_STEP_SUMMARY
          fi
          exit $status
