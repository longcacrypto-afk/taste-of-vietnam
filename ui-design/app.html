<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hôm nay ăn gì · Taste of Vietnam</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#18181B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ăn Gì?" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <script src="/assets/tailwindcss.min.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #18181B; color: #F4F4F5;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .app-shell {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100%; max-width: 480px;
      margin: 0 auto; background: #18181B;
      padding-top: env(safe-area-inset-top);
    }
    .app-header {
      flex-shrink: 0; padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(24,24,27,0.95); backdrop-filter: blur(12px);
    }
    .app-main {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 16px 24px;
    }
    .app-nav {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      align-items: center; background: #111114;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; font-weight: 600; color: #71717A;
      background: none; border: none; padding: 4px 0; cursor: pointer;
    }
    .nav-btn.active { color: #FBBF24; font-weight: 800; }
    .fab-btn {
      width: 48px; height: 48px; border-radius: 9999px;
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      color: #18181B; font-size: 20px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin: -14px auto 0; border: 3px solid #18181B;
      box-shadow: 0 6px 20px rgba(251,191,36,0.35); cursor: pointer;
    }
    .card {
      background: #27272A; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 14px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="app-header">
      <div>
        <div class="text-sm font-extrabold text-amber-400 tracking-tight">🍜 Hôm nay ăn gì?</div>
        <div id="weather-bar" class="text-[11px] text-zinc-400">Đang tải thời tiết & khẩu vị...</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSpinModal()" class="px-2.5 py-1.5 rounded-xl bg-amber-400/15 text-amber-300 text-xs font-bold border border-amber-400/30">🎲 Quay món</button>
      </div>
    </header>

    <!-- Single Active Screen Content -->
    <main id="app-main" class="app-main"></main>

    <!-- Fixed 5-Tab Bottom Navigation -->
    <nav class="app-nav">
      <button class="nav-btn active" data-tab="today" onclick="switchTab('today')">
        <span class="text-lg">🏠</span><span>Hôm nay</span>
      </button>
      <button class="nav-btn" data-tab="explore" onclick="switchTab('explore')">
        <span class="text-lg">🧭</span><span>Khám phá</span>
      </button>
      <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')">
        <div class="fab-btn">🤖</div>
        <span class="mt-0.5 text-amber-400 font-bold">Măm AI</span>
      </button>
      <button class="nav-btn" data-tab="places" onclick="switchTab('places')">
        <span class="text-lg">📍</span><span>Quán 3km</span>
      </button>
      <button class="nav-btn" data-tab="more" onclick="switchTab('more')">
        <span class="text-lg">👤</span><span>Cá nhân</span>
      </button>
    </nav>
  </div>

  <!-- Clean Single Modal Overlay -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full max-w-[480px] max-h-[85dvh] overflow-y-auto bg-zinc-900 border-t sm:border border-zinc-700 rounded-t-3xl sm:rounded-3xl p-5"></div>
  </div>

  <script>
    const API = '/api/v1';
    let currentTab = 'today';
    let subView = null; // e.g., 'meal_plan', 'fridge', 'recipes'
    let chatMessages = [
      { isUser: false, text: 'Chào anh! 👋 Mình là Măm AI. Hôm nay anh muốn ăn gì, mấy người, ngân sách bao nhiêu?' }
    ];
    let familySize = 4;
    let mealsPerDay = 3;

    async function apiGet(path) {
      const r = await fetch(API + path);
      return r.json();
    }
    async function apiPost(path, body = {}) {
      const r = await fetch(API + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return r.json();
    }
    async function apiPut(path, body = {}) {
      const r = await fetch(API + path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return r.json();
    }
    async function apiDelete(path) {
      const r = await fetch(API + path, { method: 'DELETE' });
      return r.json();
    }

    function fmtVnd(n) {
      return Number(n || 0).toLocaleString('vi-VN') + 'đ';
    }

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-zinc-950 font-bold text-xs px-4 py-2 rounded-full shadow-lg';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function openModal(html) {
      document.getElementById('modal-box').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function switchTab(tab) {
      currentTab = tab;
      subView = null;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      renderCurrentTab();
    }

    async function renderCurrentTab() {
      const main = document.getElementById('app-main');
      main.innerHTML = '<div class="text-center py-12 text-zinc-400 text-xs">Đang tải dữ liệu...</div>';
      if (currentTab === 'today') await renderToday(main);
      else if (currentTab === 'explore') await renderExplore(main);
      else if (currentTab === 'chat') renderChat(main);
      else if (currentTab === 'places') await renderPlaces(main);
      else if (currentTab === 'more') await renderMore(main);
    }

    // ─── TAB 1: TODAY ────────────────────────────────────────────────────────
    async function renderToday(main) {
      const data = await apiGet('/suggestions/today');
      const weather = data.weather?.label || '🌧️ 26°C · Trời dịu mát';
      document.getElementById('weather-bar').textContent = weather;
      const items = data.items || [];
      main.innerHTML = `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-extrabold">✨ 3 Gợi Ý AI Hôm Nay</h2>
            <button onclick="renderCurrentTab()" class="text-xs text-amber-400 font-bold">↻ Làm mới</button>
          </div>
          ${items.map(it => `
            <div class="card space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-extrabold text-white">${it.dish_name}</span>
                    ${it.is_sponsored ? '<span class="px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 text-[10px] font-bold">Tài trợ</span>' : ''}
                  </div>
                  <p class="text-xs text-zinc-400 mt-1">${it.reason || 'Hợp khẩu vị & thời tiết hôm nay'}</p>
                </div>
                <span class="text-xs font-extrabold text-amber-400 shrink-0">${fmtVnd(it.ref_price)}</span>
              </div>
              <div class="flex items-center gap-2 text-[11px] text-zinc-400">
                <span>🔥 ${it.calories || 480} kcal</span>
                <span>•</span>
                <span>📍 ${it.nearest_place?.name || 'Quán gần bạn'}</span>
              </div>
              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="openDishModal('${it.dish_id}')" class="py-2 rounded-xl bg-zinc-800 text-white text-xs font-bold border border-zinc-700">📖 Công thức</button>
                <button onclick="markEaten('${it.dish_id}', '${it.dish_name.replace(/'/g, '')}')" class="py-2 rounded-xl bg-amber-400 text-zinc-950 text-xs font-extrabold">✅ Đã ăn (Cooldown)</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function markEaten(dishId, name) {
      await apiPost('/suggestions/feedback', { dish_id: dishId, action: 'eaten' });
      showToast(`Đã ghi nhận "${name}" · Cooldown 3 ngày`);
      renderCurrentTab();
    }

    async function openSpinModal() {
      const res = await apiGet('/suggestions/spin');
      const d = res.picked_dish || {};
      openModal(`
        <div class="space-y-4 text-center">
          <div class="text-4xl">🎲</div>
          <h3 class="text-lg font-extrabold text-amber-400">${d.name || 'Phở Bò Hà Nội'}</h3>
          <p class="text-xs text-zinc-400">${d.description || 'Món ngon an toàn 100% theo bộ lọc dị ứng của anh'}</p>
          <div class="text-sm font-bold text-emerald-400">${fmtVnd(d.ref_price)} · 🔥 ${d.calories || 450} kcal</div>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="openSpinModal()" class="py-2.5 rounded-xl bg-zinc-800 text-white text-xs font-bold">🔄 Quay lại</button>
            <button onclick="closeModal()" class="py-2.5 rounded-xl bg-amber-400 text-zinc-950 text-xs font-extrabold">Chọn món này</button>
          </div>
        </div>
      `);
    }

    async function openDishModal(dishId, servings = 2) {
      const d = await apiGet(`/dishes/${dishId}?servings=${servings}`);
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-amber-400">${d.name}</h3>
            <button onclick="closeModal()" class="text-zinc-400 text-lg">✕</button>
          </div>
          <p class="text-xs text-zinc-300">${d.description || ''}</p>
          <div class="flex items-center justify-between bg-zinc-800 rounded-xl p-3">
            <span class="text-xs font-bold">Khẩu phần: ${servings} người</span>
            <div class="flex gap-2">
              <button onclick="openDishModal('${dishId}', ${Math.max(1, servings - 1)})" class="w-7 h-7 rounded-lg bg-zinc-700 font-bold">-</button>
              <button onclick="openDishModal('${dishId}', ${Math.min(10, servings + 1)})" class="w-7 h-7 rounded-lg bg-amber-400 text-black font-bold">+</button>
            </div>
          </div>
          <div class="text-xs font-bold text-zinc-400">Nguyên liệu (${d.scaled_calories_total || d.calories} kcal):</div>
          <div class="space-y-1.5">
            ${(d.scaled_ingredients || []).map(i => `
              <div class="flex justify-between text-xs bg-zinc-800/70 px-3 py-2 rounded-lg">
                <span>${i.name}</span><span class="text-amber-300 font-bold">${i.scaled_amount} ${i.unit}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    // ─── TAB 2: EXPLORE (SEARCH + MEAL PLAN 3 MEALS + FRIDGE) ────────────────
    async function renderExplore(main, query = '') {
      const res = await apiGet(`/dishes?q=${encodeURIComponent(query)}`);
      const items = res.items || [];
      main.innerHTML = `
        <div class="space-y-3">
          <div class="flex gap-2">
            <input id="dish-search" value="${query}" placeholder="Tìm món (VD: bun bo, com tam)..."
              onkeydown="if(event.key==='Enter') renderExplore(document.getElementById('app-main'), this.value)"
              class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400" />
            <button onclick="renderExplore(document.getElementById('app-main'), document.getElementById('dish-search').value)"
              class="px-3 py-2 rounded-xl bg-amber-400 text-zinc-950 text-xs font-extrabold">Tìm</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="switchSubView('meal_plan')" class="py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs font-bold text-amber-300">📅 Thực đơn 7 ngày (3 bữa)</button>
            <button onclick="switchSubView('fridge')" class="py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs font-bold text-emerald-400">🧊 Tủ lạnh AI (M18)</button>
          </div>
          <div class="text-xs font-bold text-zinc-400">Thư viện món Việt (${items.length} món an toàn):</div>
          ${items.map(d => `
            <div onclick="openDishModal('${d.id}')" class="card flex items-center justify-between cursor-pointer">
              <div>
                <div class="text-sm font-bold">${d.name}</div>
                <div class="text-[11px] text-zinc-400">${d.region} · 🔥 ${d.calories} kcal</div>
              </div>
              <span class="text-xs font-extrabold text-amber-400">${fmtVnd(d.ref_price)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ─── TAB 3: MĂM AI CHAT ──────────────────────────────────────────────────
    function renderChat(main) {
      main.innerHTML = `
        <div class="flex flex-col h-full justify-between gap-3">
          <div id="chat-log" class="flex-1 overflow-y-auto space-y-2.5">
            ${chatMessages.map(m => `
              <div class="flex ${m.isUser ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed ${m.isUser ? 'bg-amber-400 text-zinc-950 font-bold' : 'bg-zinc-800 text-zinc-100 border border-zinc-700'}">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="space-y-2 shrink-0">
            <div class="flex gap-1.5 overflow-x-auto pb-1">
              <button onclick="sendChat('Tối nay 4 người, 300k, có trẻ nhỏ')" class="shrink-0 px-2.5 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-[11px]">👨‍👩‍👧‍👦 4 người 300k</button>
              <button onclick="sendChat('Trời mưa ăn gì ấm bụng?')" class="shrink-0 px-2.5 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-[11px]">🌧️ Trời mưa</button>
              <button onclick="sendChat('Món chay thanh đạm')" class="shrink-0 px-2.5 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-[11px]">🥗 Món chay</button>
            </div>
            <div class="flex gap-2">
              <input id="chat-input" placeholder="Hỏi Măm AI..." onkeydown="if(event.key==='Enter') sendChat()"
                class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400" />
              <button onclick="sendChat()" class="px-4 py-2.5 rounded-xl bg-amber-400 text-zinc-950 text-xs font-extrabold">Gửi</button>
            </div>
          </div>
        </div>
      `;
    }

    async function sendChat(prefill) {
      const inp = document.getElementById('chat-input');
      const q = (prefill || (inp ? inp.value : '')).trim();
      if (!q) return;
      chatMessages.push({ isUser: true, text: q });
      renderChat(document.getElementById('app-main'));
      const res = await apiPost('/chat', { query: q });
      const opts = (res.options || []).map(o => `• ${o.dish_name} (${fmtVnd(o.est_total_vnd || o.ref_price)})`).join('<br/>');
      chatMessages.push({
        isUser: false,
        text: `${res.reply || 'Măm gợi ý cho anh:'}${opts ? '<br/><br/>' + opts : ''}`
      });
      renderChat(document.getElementById('app-main'));
    }

    // ─── TAB 4: PLACES 3KM ───────────────────────────────────────────────────
    async function renderPlaces(main) {
      const res = await apiGet('/places');
      const places = res.items || res.places || [];
      main.innerHTML = `
        <div class="space-y-3">
          <h2 class="text-base font-extrabold">📍 Quán Đang Mở (Bán kính 3km)</h2>
          ${places.map(p => `
            <div class="card space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <div class="text-sm font-extrabold">${p.name}</div>
                  <div class="text-[11px] text-zinc-400">${p.address} · ${(p.distance_m/1000).toFixed(1)} km</div>
                </div>
                <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-bold">Đang mở</span>
              </div>
              <div class="grid grid-cols-3 gap-1.5 pt-1">
                <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" class="text-center py-2 rounded-lg bg-zinc-800 text-[11px] font-bold border border-zinc-700">🗺️ Chỉ đường</a>
                <button onclick="bookTable('${p.id}', '${p.name.replace(/'/g, '')}')" class="py-2 rounded-lg bg-amber-400 text-zinc-950 text-[11px] font-extrabold">🪑 Đặt bàn</button>
                <button onclick="reportPlace('${p.id}')" class="py-2 rounded-lg bg-red-500/15 text-red-400 text-[11px] font-bold border border-red-500/30">⚠️ Báo đóng</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function bookTable(placeId, name) {
      const res = await apiPost('/bookings', { place_id: placeId, party_size: familySize, time_slot: '19:00 Hôm nay' });
      showToast(`Đã đặt bàn ${name} (${res.booking_id})`);
    }

    async function reportPlace(placeId) {
      const res = await apiPost(`/places/${placeId}/reports`, { reason: 'Quán đóng cửa' });
      showToast(`Đã báo cáo (${res.report_count}/3)`);
    }

    // ─── TAB 5: CÁ NHÂN & CÁC MODULE MỞ RỘNG ─────────────────────────────────
    async function renderMore(main) {
      const prof = await apiGet('/me/profile');
      main.innerHTML = `
        <div class="space-y-3">
          <div class="card space-y-2">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-sm font-extrabold">👤 ${prof.name || 'Hồ sơ vị giác'}</div>
                <div class="text-[11px] text-zinc-400">Dị ứng: ${(prof.hard_allergies || []).join(', ') || 'Không có'} · Cay: ${prof.spice_level ?? 1}/3</div>
              </div>
              <button onclick="exportPdpd()" class="px-2.5 py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 text-[11px] font-bold text-amber-300">📥 PDPD JSON</button>
            </div>
          </div>
          <div class="text-xs font-bold text-zinc-400">Mở từng màn hình chức năng (gọn 1 màn hình):</div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="switchSubView('meal_plan')" class="card text-left space-y-1">
              <div class="text-xl">📅</div><div class="text-xs font-bold">Thực đơn 7 ngày</div><div class="text-[10px] text-zinc-400">3 bữa/ngày · Gia đình</div>
            </button>
            <button onclick="switchSubView('fridge')" class="card text-left space-y-1">
              <div class="text-xl">🧊</div><div class="text-xs font-bold">Tủ lạnh AI</div><div class="text-[10px] text-zinc-400">Thêm/sửa/xóa nguyên liệu</div>
            </button>
            <button onclick="switchSubView('recipes')" class="card text-left space-y-1">
              <div class="text-xl">🍳</div><div class="text-xs font-bold">Bếp cộng đồng</div><div class="text-[10px] text-zinc-400">Công thức & Tip VietQR</div>
            </button>
            <button onclick="switchSubView('merchant')" class="card text-left space-y-1">
              <div class="text-xl">🏪</div><div class="text-xs font-bold">Cổng Quán M6</div><div class="text-[10px] text-zinc-400">Menu & Chiến dịch</div>
            </button>
          </div>
          <a href="/studio?studio=1" class="block text-center py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-xs text-zinc-400 font-semibold">🖥️ Chuyển sang 99-Screen Studio (Desktop)</a>
        </div>
      `;
    }

    async function exportPdpd() {
      const data = await apiGet('/me/export');
      openModal(`
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="text-sm font-extrabold text-amber-400">📥 Dữ Liệu Cá Nhân (PDPD)</h3>
            <button onclick="closeModal()" class="text-zinc-400">✕</button>
          </div>
          <pre class="text-[10px] bg-black p-3 rounded-xl overflow-x-auto text-emerald-300">${JSON.stringify(data, null, 2)}</pre>
        </div>
      `);
    }

    async function switchSubView(view) {
      const main = document.getElementById('app-main');
      if (view === 'meal_plan') {
        const plan = await apiGet(`/meal-plans/weekly?family_size=${familySize}&meals_per_day=${mealsPerDay}`);
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="renderCurrentTab()" class="text-xs text-amber-400 font-bold">← Quay lại</button>
              <span class="text-xs font-extrabold">📅 Thực Đơn 7 Ngày (${familySize} người)</span>
            </div>
            <div class="card flex items-center justify-between">
              <span class="text-xs font-bold">👨‍👩‍👧‍👦 Số người: ${familySize}</span>
              <div class="flex gap-2">
                <button onclick="familySize=Math.max(1,familySize-1);switchSubView('meal_plan')" class="w-7 h-7 rounded-lg bg-zinc-800 font-bold">-</button>
                <button onclick="familySize=Math.min(10,familySize+1);switchSubView('meal_plan')" class="w-7 h-7 rounded-lg bg-amber-400 text-black font-bold">+</button>
              </div>
            </div>
            ${(plan.days || []).map(d => `
              <div class="card space-y-1.5">
                <div class="flex justify-between text-xs font-extrabold text-amber-400">
                  <span>${d.day}</span><span>${fmtVnd(d.est_market_cost_vnd)}</span>
                </div>
                <div class="text-xs text-zinc-200">☀️ Sáng: <b>${d.meals?.breakfast?.dish_name || d.dish_name}</b></div>
                <div class="text-xs text-zinc-200">🥢 Trưa: <b>${d.meals?.lunch?.dish_name || d.dish_name}</b></div>
                <div class="text-xs text-zinc-200">🌙 Tối: <b>${d.meals?.dinner?.dish_name || d.dish_name}</b></div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'fridge') {
        const inv = await apiGet('/fridge/inventory');
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="renderCurrentTab()" class="text-xs text-amber-400 font-bold">← Quay lại</button>
              <button onclick="addFridgeQuick()" class="px-2.5 py-1 rounded-lg bg-amber-400 text-black text-xs font-extrabold">+ Thêm đồ</button>
            </div>
            ${(inv.items || []).map(it => `
              <div class="card flex items-center justify-between">
                <div>
                  <div class="text-sm font-bold">${it.name}</div>
                  <div class="text-[11px] text-zinc-400">${it.quantity} · Còn ${it.expires_in_days} ngày</div>
                </div>
                <button onclick="delFridge('${it.id}')" class="text-red-400 text-xs font-bold">Xóa</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'recipes') {
        const rec = await apiGet('/community/recipes');
        main.innerHTML = `
          <div class="space-y-3">
            <button onclick="renderCurrentTab()" class="text-xs text-amber-400 font-bold">← Quay lại</button>
            ${(rec.recipes || []).map(r => `
              <div class="card space-y-2">
                <div class="text-sm font-extrabold">${r.title}</div>
                <div class="text-[11px] text-zinc-400">👨‍🍳 ${r.author} · ⏱️ ${r.prep_time_minutes}p · ❤️ ${r.likes_count}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'merchant') {
        const menu = await apiGet('/merchant/menu');
        main.innerHTML = `
          <div class="space-y-3">
            <button onclick="renderCurrentTab()" class="text-xs text-amber-400 font-bold">← Quay lại</button>
            <div class="text-sm font-extrabold">🏪 Thực Đơn Quán (M6)</div>
            ${(menu.items || []).map(m => `
              <div class="card flex justify-between items-center">
                <span class="text-xs font-bold">${m.name}</span>
                <span class="text-xs text-amber-400 font-extrabold">${fmtVnd(m.price_vnd)}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    async function addFridgeQuick() {
      const name = prompt('Tên nguyên liệu:');
      if (!name) return;
      await apiPost('/fridge/inventory', { name, quantity: '300g', compartment: 'chill', expires_in_days: 3 });
      showToast('Đã thêm vào tủ lạnh');
      switchSubView('fridge');
    }

    async function delFridge(id) {
      await apiDelete(`/fridge/inventory/${id}`);
      showToast('Đã xóa nguyên liệu');
      switchSubView('fridge');
    }

    renderCurrentTab();
  </script>
</body>
</html>
