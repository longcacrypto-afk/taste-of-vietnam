<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hôm nay ăn gì · Taste of Vietnam</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FBBF24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ăn Gì?" />
  <link rel="apple-touch-icon" href="/assets/mascot_mam.jpg" />
  <script src="/assets/tailwindcss.min.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #F4F6F9; color: #0F172A;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .app-shell {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100%; max-width: 480px;
      margin: 0 auto; background: #FFFFFF;
      padding-top: env(safe-area-inset-top);
      box-shadow: 0 20px 50px rgba(15,23,42,0.12);
    }
    .app-header {
      flex-shrink: 0; padding: 12px 16px 10px;
      border-bottom: 1px solid #F1F5F9;
      display: flex; align-items: center; justify-content: space-between;
      background: #FFFFFF;
    }
    .app-main {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 16px 24px; background: #F8FAFC;
    }
    .app-nav {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr);
      align-items: center; background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; font-weight: 600; color: #64748B;
      background: none; border: none; padding: 4px 0; cursor: pointer;
    }
    .nav-btn.active { color: #F59E0B; font-weight: 800; }
    .fab-btn {
      width: 48px; height: 48px; border-radius: 9999px;
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      color: #0F172A; font-size: 22px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin: -18px auto 0; border: 3px solid #FFFFFF;
      box-shadow: 0 8px 20px rgba(245,158,11,0.35); cursor: pointer;
    }
    .lux-card {
      background: #FFFFFF; border: 1px solid #E2E8F0;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 6px 20px -6px rgba(15,23,42,0.06);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header matching Benchmark Screen 1 -->
    <header class="app-header">
      <div class="flex items-center gap-2.5">
        <img src="/assets/mascot_mam.jpg" alt="Măm" class="w-9 h-9 rounded-full object-cover border-2 border-[#FBBF24]" />
        <div>
          <div class="text-sm font-black text-[#0F172A] leading-tight">Hôm nay ăn gì?</div>
          <div id="weather-bar" class="text-[11px] font-semibold text-[#64748B]">Đang đồng bộ thời tiết...</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="openSpinModal()" class="px-3 py-1.5 rounded-full bg-[#FEF3C7] text-[#B45309] text-xs font-extrabold border border-[#FDE68A]">
          🎲 Quay món
        </button>
      </div>
    </header>

    <!-- Single Active Screen Content -->
    <main id="app-main" class="app-main"></main>

    <!-- Fixed 5-Tab Bottom Bar matching Benchmark -->
    <nav class="app-nav">
      <button class="nav-btn active" data-tab="today" onclick="switchTab('today')">
        <span class="text-lg">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" data-tab="explore" onclick="switchTab('explore')">
        <span class="text-lg">🧭</span><span>Explore</span>
      </button>
      <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')">
        <div class="fab-btn">+</div>
        <span class="mt-0.5 text-[#F59E0B] font-extrabold">Măm AI</span>
      </button>
      <button class="nav-btn" data-tab="places" onclick="switchTab('places')">
        <span class="text-lg">📍</span><span>Quán 3km</span>
      </button>
      <button class="nav-btn" data-tab="more" onclick="switchTab('more')">
        <span class="text-lg">👤</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Clean Single Modal Sheet -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full max-w-[480px] max-h-[88dvh] overflow-y-auto bg-white text-[#0F172A] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl"></div>
  </div>

  <script>
    const API = '/api/v1';
    let currentTab = 'today';
    let familySize = 4;
    let mealsPerDay = 3;
    let selectedRegion = '';
    let chatMessages = [
      { isUser: false, text: 'Xin chào anh! 👋 Mình là Măm — trợ lý ẩm thực AI. Anh muốn ăn món gì, mấy người, ngân sách bao nhiêu?' }
    ];

    const DISH_PHOTOS = {
      'DISH-101': '/assets/hero_pho.jpg',
      'DISH-102': '/assets/dish_banhmi.jpg',
      'DISH-103': '/assets/hero_pho.jpg',
      'DISH-104': '/assets/dish_banhmi.jpg',
      'DISH-105': '/assets/place_restaurant.jpg',
      'DISH-106': '/assets/dish_banhmi.jpg'
    };

    function dishImg(id) {
      return DISH_PHOTOS[id] || '/assets/hero_pho.jpg';
    }

    async function apiGet(path) {
      const r = await fetch(API + path);
      return r.json();
    }
    async function apiPost(path, body = {}) {
      const r = await fetch(API + path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      return r.json();
    }
    async function apiPut(path, body = {}) {
      const r = await fetch(API + path, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      return r.json();
    }
    async function apiDelete(path) {
      const r = await fetch(API + path, { method: 'DELETE' });
      return r.json();
    }

    function fmtVnd(n) {
      return Number(n || 0).toLocaleString('vi-VN') + 'đ';
    }

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#18181B] text-[#FBBF24] font-bold text-xs px-4 py-2.5 rounded-full shadow-xl border border-[#FBBF24]/40';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }
    function openModal(html) {
      document.getElementById('modal-box').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      renderCurrentTab();
    }

    async function renderCurrentTab() {
      const main = document.getElementById('app-main');
      main.innerHTML = '<div class="text-center py-12 text-[#64748B] text-xs font-semibold">⏳ Đang tải dữ liệu thực tế...</div>';
      if (currentTab === 'today') await renderToday(main);
      else if (currentTab === 'explore') await renderExplore(main);
      else if (currentTab === 'chat') renderChat(main);
      else if (currentTab === 'places') await renderPlaces(main);
      else if (currentTab === 'more') await renderMore(main);
    }

    // ─── TAB 1: HOME (M3-S01 AI CHEF BENCHMARK) ──────────────────────────────
    async function renderToday(main) {
      const data = await apiGet('/suggestions/today');
      document.getElementById('weather-bar').textContent = data.weather?.label || '🌧️ 26°C · Trời dịu mát';
      const items = data.items || [];
      main.innerHTML = `
        <div class="space-y-4">
          <!-- Mascot Măm Hero Card -->
          <div class="bg-[#18181B] text-white rounded-3xl p-4 flex items-center gap-3 shadow-lg">
            <img src="/assets/mascot_mam.jpg" class="w-12 h-12 rounded-2xl object-cover border border-[#FBBF24]" />
            <div class="flex-1">
              <div class="text-xs font-extrabold text-[#FBBF24]">✨ Trợ lý Măm AI gợi ý hôm nay</div>
              <div class="text-[11px] text-zinc-300 mt-0.5">Đã lọc cứng dị ứng 100% & không lặp món trong 3 ngày</div>
            </div>
            <button onclick="renderCurrentTab()" class="px-2.5 py-1.5 rounded-xl bg-white/10 text-xs font-bold">↻</button>
          </div>

          ${items.map(it => `
            <div class="lux-card">
              <div class="relative h-36 w-full bg-zinc-200">
                <img src="${dishImg(it.dish_id)}" class="w-full h-full object-cover" />
                <div class="absolute top-2.5 left-2.5 flex gap-1.5">
                  <span class="px-2.5 py-1 rounded-full bg-white/95 text-[#0F172A] text-[10px] font-extrabold shadow-sm">🔥 ${it.calories || 480} kcal</span>
                  ${it.is_sponsored ? '<span class="px-2.5 py-1 rounded-full bg-[#FEF3C7] text-[#B45309] text-[10px] font-extrabold shadow-sm">Tài trợ</span>' : ''}
                </div>
                <span class="absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-full bg-[#18181B]/90 text-[#FBBF24] text-xs font-black">${fmtVnd(it.ref_price)}</span>
              </div>
              <div class="p-3.5 space-y-2.5">
                <div>
                  <h3 class="text-sm font-black text-[#0F172A]">${it.dish_name}</h3>
                  <p class="text-xs text-[#64748B] mt-0.5">${it.reason || 'Phù hợp khẩu vị & thời tiết hôm nay'}</p>
                  <div class="text-[11px] text-[#15803D] font-bold mt-1">📍 ${it.nearest_place?.name || 'Quán gần bạn'}</div>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <button onclick="openDishModal('${it.dish_id}')" class="py-2.5 rounded-xl bg-[#F8FAFC] text-[#0F172A] text-xs font-extrabold border border-[#E2E8F0]">📖 Công thức</button>
                  <button onclick="markEaten('${it.dish_id}', '${it.dish_name.replace(/'/g, '')}')" class="py-2.5 rounded-xl bg-[#FBBF24] text-[#0F172A] text-xs font-black shadow-sm">✅ Đã ăn</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function markEaten(dishId, name) {
      await apiPost('/suggestions/feedback', { dish_id: dishId, action: 'eaten' });
      showToast(`Đã ăn "${name}" · Cooldown 3 ngày`);
      renderCurrentTab();
    }

    async function openSpinModal() {
      const res = await apiGet('/suggestions/spin');
      const d = res.picked_dish || {};
      openModal(`
        <div class="space-y-3 text-center">
          <img src="${dishImg(d.id)}" class="w-full h-36 object-cover rounded-2xl" />
          <div class="text-xs font-extrabold text-[#F59E0B]">🎲 KẾT QUẢ QUAY NGẪU NHIÊN</div>
          <h3 class="text-lg font-black text-[#0F172A]">${d.name || 'Phở Bò Hà Nội'}</h3>
          <p class="text-xs text-[#64748B]">${d.description || ''}</p>
          <div class="text-sm font-extrabold text-[#15803D]">${fmtVnd(d.ref_price)} · 🔥 ${d.calories || 450} kcal</div>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="openSpinModal()" class="py-2.5 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-xs font-bold">🔄 Quay lại</button>
            <button onclick="closeModal(); openDishModal('${d.id || 'DISH-101'}')" class="py-2.5 rounded-xl bg-[#FBBF24] text-[#0F172A] text-xs font-black">Xem chi tiết</button>
          </div>
        </div>
      `);
    }

    async function openDishModal(dishId, servings = 2) {
      const d = await apiGet(`/dishes/${dishId}?servings=${servings}`);
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-black text-[#0F172A]">${d.name}</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F1F5F9] font-bold">✕</button>
          </div>
          <img src="${dishImg(d.id)}" class="w-full h-36 object-cover rounded-2xl" />
          <p class="text-xs text-[#64748B]">${d.description || ''}</p>
          <div class="flex items-center justify-between bg-[#FFFBEB] border border-[#FDE68A] rounded-2xl p-3">
            <span class="text-xs font-extrabold text-[#B45309]">⚖️ Khẩu phần: ${servings} người</span>
            <div class="flex gap-2">
              <button onclick="openDishModal('${dishId}', ${Math.max(1, servings - 1)})" class="w-7 h-7 rounded-lg bg-white border border-[#E2E8F0] font-black">-</button>
              <button onclick="openDishModal('${dishId}', ${Math.min(10, servings + 1)})" class="w-7 h-7 rounded-lg bg-[#FBBF24] text-[#0F172A] font-black">+</button>
            </div>
          </div>
          <div class="text-xs font-extrabold text-[#0F172A]">Nguyên liệu (${d.scaled_calories_total || d.calories} kcal):</div>
          <div class="space-y-1.5">
            ${(d.scaled_ingredients || []).map(i => `
              <div class="flex justify-between text-xs bg-[#F8FAFC] border border-[#E2E8F0] px-3 py-2 rounded-xl">
                <span class="font-semibold">${i.name}</span><span class="text-[#D97706] font-extrabold">${i.scaled_amount} ${i.unit}</span>
              </div>
            `).join('')}
          </div>
          <button onclick="saveToFav('${d.id}')" class="w-full py-2.5 rounded-xl bg-[#18181B] text-[#FBBF24] text-xs font-extrabold">🔖 Lưu vào Bộ sưu tập</button>
        </div>
      `);
    }

    async function saveToFav(dishId) {
      await apiPost('/me/collections', { dish_id: dishId });
      showToast('Đã lưu vào Bộ sưu tập');
    }

    // ─── TAB 2: EXPLORE (M2 + M11 + M18) ──────────────────────────────────────
    async function renderExplore(main, query = '') {
      const res = await apiGet(`/dishes?q=${encodeURIComponent(query)}&region=${encodeURIComponent(selectedRegion)}`);
      const items = res.items || [];
      main.innerHTML = `
        <div class="space-y-3">
          <div class="flex gap-2">
            <input id="dish-search" value="${query}" placeholder="Tìm món (VD: bun bo, com tam)..."
              onkeydown="if(event.key==='Enter') renderExplore(document.getElementById('app-main'), this.value)"
              class="flex-1 bg-white border border-[#E2E8F0] rounded-2xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-[#FBBF24]" />
            <button onclick="renderExplore(document.getElementById('app-main'), document.getElementById('dish-search').value)"
              class="px-4 py-2.5 rounded-2xl bg-[#FBBF24] text-[#0F172A] text-xs font-black">Tìm</button>
          </div>
          <div class="flex gap-1.5 overflow-x-auto pb-1">
            ${['', 'Miền Bắc', 'Miền Trung', 'Miền Nam'].map(r => `
              <button onclick="selectedRegion='${r}'; renderExplore(document.getElementById('app-main'), document.getElementById('dish-search')?.value||'')"
                class="shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border ${selectedRegion===r ? 'bg-[#18181B] text-[#FBBF24] border-[#18181B]' : 'bg-white text-[#64748B] border-[#E2E8F0]'}">
                ${r || 'Tất cả 3 miền'}
              </button>
            `).join('')}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="switchSubView('meal_plan')" class="p-3 rounded-2xl bg-[#FFFBEB] border border-[#FDE68A] text-left">
              <div class="text-base">📅</div>
              <div class="text-xs font-extrabold text-[#92400E]">Thực đơn 7 ngày</div>
              <div class="text-[10px] text-[#B45309]">3 bữa/ngày · Gia đình</div>
            </button>
            <button onclick="switchSubView('fridge')" class="p-3 rounded-2xl bg-[#F0FDF4] border border-[#BBF7D0] text-left">
              <div class="text-base">🧊</div>
              <div class="text-xs font-extrabold text-[#166534]">Tủ lạnh AI (M18)</div>
              <div class="text-[10px] text-[#15803D]">Thêm/sửa/xóa thực phẩm</div>
            </button>
          </div>
          <div class="text-xs font-extrabold text-[#64748B]">Thư viện món ăn (${items.length} món an toàn):</div>
          ${items.map(d => `
            <div onclick="openDishModal('${d.id}')" class="lux-card p-3 flex items-center gap-3 cursor-pointer">
              <img src="${dishImg(d.id)}" class="w-16 h-16 rounded-xl object-cover shrink-0" />
              <div class="flex-1 min-w-0">
                <div class="text-sm font-extrabold text-[#0F172A] truncate">${d.name}</div>
                <div class="text-[11px] text-[#64748B]">${d.region} · 🔥 ${d.calories} kcal</div>
                <div class="text-xs font-black text-[#D97706] mt-0.5">${fmtVnd(d.ref_price)}</div>
              </div>
              <span class="text-[#94A3B8] text-sm">›</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ─── TAB 3: MĂM AI CHEF (M3-S04) ─────────────────────────────────────────
    function renderChat(main) {
      main.innerHTML = `
        <div class="flex flex-col h-full justify-between gap-3">
          <div id="chat-log" class="flex-1 overflow-y-auto space-y-3">
            ${chatMessages.map(m => `
              <div class="flex items-end gap-2 ${m.isUser ? 'justify-end' : 'justify-start'}">
                ${!m.isUser ? '<img src="/assets/avatar_mam_ai.jpg" class="w-7 h-7 rounded-full object-cover shrink-0" />' : ''}
                <div class="max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed shadow-sm ${m.isUser ? 'bg-[#18181B] text-[#FBBF24] font-bold' : 'bg-white text-[#0F172A] border border-[#E2E8F0]'}">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="space-y-2 shrink-0 pt-1">
            <div class="flex gap-1.5 overflow-x-auto pb-1">
              <button onclick="sendChat('Tối nay 4 người, 300k, có trẻ nhỏ')" class="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#E2E8F0] text-[11px] font-bold">👨‍👩‍👧‍👦 4 người 300k</button>
              <button onclick="sendChat('Trời mưa ăn gì ấm bụng?')" class="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#E2E8F0] text-[11px] font-bold">🌧️ Trời mưa</button>
              <button onclick="sendChat('Món chay thanh đạm')" class="shrink-0 px-3 py-1.5 rounded-full bg-white border border-[#E2E8F0] text-[11px] font-bold">🥗 Món chay</button>
            </div>
            <div class="flex gap-2">
              <input id="chat-input" placeholder="Nhắn cho Măm AI..." onkeydown="if(event.key==='Enter') sendChat()"
                class="flex-1 bg-white border border-[#E2E8F0] rounded-2xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-[#FBBF24]" />
              <button onclick="sendChat()" class="px-4 py-2.5 rounded-2xl bg-[#FBBF24] text-[#0F172A] text-xs font-black">Gửi</button>
            </div>
          </div>
        </div>
      `;
    }

    async function sendChat(prefill) {
      const inp = document.getElementById('chat-input');
      const q = (prefill || (inp ? inp.value : '')).trim();
      if (!q) return;
      chatMessages.push({ isUser: true, text: q });
      renderChat(document.getElementById('app-main'));
      const res = await apiPost('/chat', { query: q });
      const opts = (res.options || []).map(o => `• <b>${o.dish_name}</b> (${fmtVnd(o.est_total_vnd || o.ref_price)})`).join('<br/>');
      chatMessages.push({
        isUser: false,
        text: `${res.reply || 'Măm gợi ý cho anh:'}${opts ? '<br/><br/>' + opts : ''}`
      });
      renderChat(document.getElementById('app-main'));
    }

    // ─── TAB 4: PLACES 3KM (M4 + M5 + M13) ────────────────────────────────────
    async function renderPlaces(main) {
      const res = await apiGet('/places');
      const places = res.items || res.places || [];
      main.innerHTML = `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-black text-[#0F172A]">📍 Quán Đang Mở (Bán kính 3km)</h2>
            <span class="px-2.5 py-0.5 rounded-full bg-[#DCFCE7] text-[#15803D] text-[10px] font-extrabold">${places.length} quán</span>
          </div>
          ${places.map(p => `
            <div class="lux-card p-3.5 space-y-2.5">
              <div class="flex gap-3">
                <img src="/assets/place_restaurant.jpg" class="w-16 h-16 rounded-xl object-cover shrink-0" />
                <div class="flex-1">
                  <div class="flex justify-between items-start gap-2">
                    <div class="text-sm font-black text-[#0F172A]">${p.name}</div>
                    <span class="px-2 py-0.5 rounded-full bg-[#DCFCE7] text-[#15803D] text-[10px] font-bold shrink-0">Đang mở</span>
                  </div>
                  <div class="text-[11px] text-[#64748B] mt-0.5">${p.address}</div>
                  <div class="text-[11px] font-bold text-[#D97706] mt-0.5">📏 ${(p.distance_m/1000).toFixed(1)} km · ⭐ ${p.rating || 4.8}</div>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-1.5">
                <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" class="text-center py-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[11px] font-bold">🗺️ Chỉ đường</a>
                <button onclick="bookTable('${p.id}', '${p.name.replace(/'/g, '')}')" class="py-2 rounded-xl bg-[#FBBF24] text-[#0F172A] text-[11px] font-black">🪑 Đặt bàn</button>
                <button onclick="reportPlace('${p.id}')" class="py-2 rounded-xl bg-[#FEF2F2] text-[#DC2626] border border-[#FECACA] text-[11px] font-bold">⚠️ Báo đóng</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function bookTable(placeId, name) {
      const res = await apiPost('/bookings', { place_id: placeId, party_size: familySize, time_slot: '19:00 Hôm nay' });
      showToast(`Đặt bàn ${name} thành công (${res.booking_id})`);
    }

    async function reportPlace(placeId) {
      const res = await apiPost(`/places/${placeId}/reports`, { reason: 'Quán đóng cửa' });
      showToast(`Đã gửi báo cáo (${res.report_count}/3)`);
    }

    // ─── TAB 5: PROFILE & ECOSYSTEM (M1, M6, M11, M18, M20) ───────────────────
    async function renderMore(main) {
      const prof = await apiGet('/me/profile');
      const allergies = prof.hard_allergies || [];
      main.innerHTML = `
        <div class="space-y-3">
          <div class="lux-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <img src="/assets/mascot_la.jpg" class="w-11 h-11 rounded-full object-cover border border-[#22C55E]" />
                <div>
                  <div class="text-sm font-black">${prof.name || 'Hồ sơ vị giác'}</div>
                  <div class="text-[11px] text-[#64748B]">Cay: ${prof.spice_level ?? 1}/3 · Dị ứng: ${allergies.join(', ') || 'Không'}</div>
                </div>
              </div>
              <button onclick="exportPdpd()" class="px-2.5 py-1.5 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[11px] font-bold">📥 PDPD</button>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${['shrimp', 'peanut', 'dairy', 'gluten'].map(al => {
                const on = allergies.includes(al);
                return `<button onclick="toggleAllergy('${al}', ${on})" class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${on ? 'bg-[#FFE4E6] text-[#BE123C] border-[#FECDD3]' : 'bg-[#F8FAFC] text-[#64748B] border-[#E2E8F0]'}">${on ? '🛡️ Chặn ' : '+ '}${al}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="text-xs font-extrabold text-[#64748B]">Tính năng mở rộng (mở từng màn hình riêng):</div>
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="switchSubView('meal_plan')" class="lux-card p-3.5 text-left space-y-1">
              <div class="text-xl">📅</div><div class="text-xs font-black">Thực đơn 7 ngày</div><div class="text-[10px] text-[#64748B]">3 bữa/ngày · Gia đình</div>
            </button>
            <button onclick="switchSubView('fridge')" class="lux-card p-3.5 text-left space-y-1">
              <div class="text-xl">🧊</div><div class="text-xs font-black">Tủ lạnh AI</div><div class="text-[10px] text-[#64748B]">Thêm/sửa/xóa thực phẩm</div>
            </button>
            <button onclick="switchSubView('recipes')" class="lux-card p-3.5 text-left space-y-1">
              <div class="text-xl">🍳</div><div class="text-xs font-black">Bếp cộng đồng</div><div class="text-[10px] text-[#64748B]">Công thức & Tip VietQR</div>
            </button>
            <button onclick="switchSubView('merchant')" class="lux-card p-3.5 text-left space-y-1">
              <div class="text-xl">🏪</div><div class="text-xs font-black">Cổng Quán M6</div><div class="text-[10px] text-[#64748B]">Thêm/sửa/xóa món</div>
            </button>
          </div>
          <a href="/studio?studio=1" class="block text-center py-2.5 rounded-2xl bg-white border border-[#E2E8F0] text-xs text-[#64748B] font-bold">🖥️ Mở 99-Screen Studio (Desktop)</a>
        </div>
      `;
    }

    async function toggleAllergy(al, currentlyOn) {
      const prof = await apiGet('/me/profile');
      let list = prof.hard_allergies || [];
      list = currentlyOn ? list.filter(x => x !== al) : [...list, al];
      await apiPut('/me/profile', { hard_allergies: list });
      showToast(currentlyOn ? `Đã bỏ chặn ${al}` : `Đã kích hoạt lọc cứng ${al}`);
      renderCurrentTab();
    }

    async function exportPdpd() {
      const data = await apiGet('/me/export');
      openModal(`
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="text-sm font-black">📥 Dữ Liệu Cá Nhân (PDPD)</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F1F5F9] font-bold">✕</button>
          </div>
          <pre class="text-[10px] bg-[#18181B] text-[#4ADE80] p-3 rounded-2xl overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>
        </div>
      `);
    }

    async function switchSubView(view) {
      const main = document.getElementById('app-main');
      if (view === 'meal_plan') {
        const plan = await apiGet(`/meal-plans/weekly?family_size=${familySize}&meals_per_day=${mealsPerDay}`);
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="renderCurrentTab()" class="text-xs text-[#D97706] font-extrabold">← Quay lại</button>
              <span class="text-xs font-black">📅 Thực Đơn 7 Ngày (${familySize} người)</span>
            </div>
            <div class="lux-card p-3 flex items-center justify-between">
              <span class="text-xs font-extrabold">👨‍👩‍👧‍👦 Quy mô: ${familySize} người · 3 bữa/ngày</span>
              <div class="flex gap-2">
                <button onclick="familySize=Math.max(1,familySize-1);switchSubView('meal_plan')" class="w-7 h-7 rounded-lg bg-[#F1F5F9] font-black">-</button>
                <button onclick="familySize=Math.min(10,familySize+1);switchSubView('meal_plan')" class="w-7 h-7 rounded-lg bg-[#FBBF24] text-[#0F172A] font-black">+</button>
              </div>
            </div>
            ${(plan.days || []).map(d => `
              <div class="lux-card p-3.5 space-y-1.5">
                <div class="flex justify-between text-xs font-black text-[#D97706]">
                  <span>${d.day}</span><span>${fmtVnd(d.est_market_cost_vnd)}</span>
                </div>
                <div class="text-xs">☀️ Sáng: <b>${d.meals?.breakfast?.dish_name || d.dish_name}</b></div>
                <div class="text-xs">🥢 Trưa: <b>${d.meals?.lunch?.dish_name || d.dish_name}</b></div>
                <div class="text-xs">🌙 Tối: <b>${d.meals?.dinner?.dish_name || d.dish_name}</b></div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'fridge') {
        const inv = await apiGet('/fridge/inventory');
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="renderCurrentTab()" class="text-xs text-[#D97706] font-extrabold">← Quay lại</button>
              <button onclick="addFridgeQuick()" class="px-3 py-1.5 rounded-xl bg-[#FBBF24] text-[#0F172A] text-xs font-black">+ Thêm đồ</button>
            </div>
            ${(inv.items || []).map(it => `
              <div class="lux-card p-3.5 flex items-center justify-between">
                <div>
                  <div class="text-sm font-extrabold">${it.name}</div>
                  <div class="text-[11px] text-[#64748B]">${it.quantity} · Còn ${it.expires_in_days} ngày</div>
                </div>
                <button onclick="delFridge('${it.id}')" class="px-2.5 py-1 rounded-lg bg-[#FEF2F2] text-[#DC2626] text-xs font-bold">Xóa</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'recipes') {
        const rec = await apiGet('/community/recipes');
        main.innerHTML = `
          <div class="space-y-3">
            <button onclick="renderCurrentTab()" class="text-xs text-[#D97706] font-extrabold">← Quay lại</button>
            ${(rec.recipes || []).map(r => `
              <div class="lux-card p-3.5 space-y-2">
                <div class="text-sm font-black">${r.title}</div>
                <div class="text-[11px] text-[#64748B]">👨‍🍳 ${r.author} · ⏱️ ${r.prep_time_minutes}p · ❤️ ${r.likes_count}</div>
                <button onclick="likeRec('${r.id}')" class="px-3 py-1.5 rounded-xl bg-[#FFFBEB] text-[#B45309] text-xs font-bold border border-[#FDE68A]">❤️ Thả tim</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'merchant') {
        const menu = await apiGet('/merchant/menu');
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="renderCurrentTab()" class="text-xs text-[#D97706] font-extrabold">← Quay lại</button>
              <button onclick="addMenuQuick()" class="px-3 py-1.5 rounded-xl bg-[#FBBF24] text-[#0F172A] text-xs font-black">+ Thêm món</button>
            </div>
            ${(menu.items || []).map(m => `
              <div class="lux-card p-3.5 flex justify-between items-center">
                <div>
                  <div class="text-xs font-black">${m.name}</div>
                  <div class="text-xs text-[#D97706] font-bold">${fmtVnd(m.price_vnd)}</div>
                </div>
                <button onclick="delMenu('${m.id}')" class="px-2.5 py-1 rounded-lg bg-[#FEF2F2] text-[#DC2626] text-xs font-bold">Xóa</button>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    async function addFridgeQuick() {
      const name = prompt('Tên nguyên liệu:');
      if (!name) return;
      await apiPost('/fridge/inventory', { name, quantity: '300g', compartment: 'chill', expires_in_days: 3 });
      showToast('Đã thêm vào tủ lạnh');
      switchSubView('fridge');
    }
    async function delFridge(id) {
      await apiDelete(`/fridge/inventory/${id}`);
      showToast('Đã xóa nguyên liệu');
      switchSubView('fridge');
    }
    async function likeRec(id) {
      await apiPost(`/community/recipes/${id}/like`, {});
      showToast('Đã thả tim công thức');
      switchSubView('recipes');
    }
    async function addMenuQuick() {
      const name = prompt('Tên món ăn mới của quán:');
      if (!name) return;
      await apiPost('/merchant/menu', { name, price_vnd: 50000 });
      showToast('Đã thêm món mới');
      switchSubView('merchant');
    }
    async function delMenu(id) {
      await apiDelete(`/merchant/menu/${id}`);
      showToast('Đã xóa món khỏi thực đơn');
      switchSubView('merchant');
    }

    renderCurrentTab();
  </script>
</body>
</html>
